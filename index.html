<body>
<div class="shell">
  <header class="brandbar"><div class="brand"><img src="./icon-192.png" alt="">My Hours</div><span class="cash-tag">CASH TRACKER</span></header>
  <aside id="install-hint" class="card hint" hidden><div><strong>Add to Home Screen</strong><p id="install-copy"></p></div><div class="hint-actions"><button type="button" class="primary" id="install-button" hidden>Install</button><button type="button" class="icon-button" id="dismiss-hint" aria-label="Dismiss install hint">×</button></div></aside>
  <div id="storage-status" class="status" role="status" hidden></div>
  <main id="view"></main>
</div>
<nav class="nav" aria-label="Main navigation" hidden><div class="nav-inner" id="tabs"></div></nav>
<dialog id="editor" aria-labelledby="editor-title"></dialog>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>
<script>
"use strict";
const jobs = [
  { name: "Beauty Bar", mark: "BB", color: "#26695C", rate: 12 },
  { name: "Regal Jewelers", mark: "RJ", color: "#C5E91F", rate: 15 }
];
const days = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const tabs = {
  Home: '<path d="m3 10 9-7 9 7v10H3zM9 20v-6h6v6"/>',
  Week: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 10h18"/>',
  Overview: '<path d="M4 20h16M7 16v-5m5 5V5m5 11V8"/>',
  Profile: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>'
};
const key = "my-hours.v1";
const timePattern = /^(?:[01]\d|2[0-3]):[0-5]\d$/;
const datePattern = /^\d{4}-\d{2}-\d{2}$/;
const view = document.querySelector("#view");
const editor = document.querySelector("#editor");
const nav = document.querySelector(".nav");
const tabList = document.querySelector("#tabs");
const money = new Intl.NumberFormat("en-US", { style:"currency", currency:"USD" });
const shortDate = new Intl.DateTimeFormat("en-US", {month:"short",day:"numeric"});
const fullDate = new Intl.DateTimeFormat("en-US", {weekday:"long",month:"long",day:"numeric"});
const monthDate = new Intl.DateTimeFormat("en-US", {month:"long",year:"numeric"});
let screen = "Home";
let overview = "Week";
let editingTemplate = false;
let editing = null;
let toastTimer;
let today = dayKey(new Date());
let week = weekStart(today);

function dayKey(date) {
  return [String(date.getFullYear()).padStart(4,"0"),String(date.getMonth()+1).padStart(2,"0"),String(date.getDate()).padStart(2,"0")].join("-");
}
function localDate(key) {
  return new Date(key + "T12:00:00");
}
function offset(key, days) {
  const date = localDate(key);
  date.setDate(date.getDate()+days);
  return dayKey(date);
}
function weekStart(key) {
  return offset(key, -localDate(key).getDay());
}
function dateRange(start, count) {
  return Array.from({length:count}, (_,index) => offset(start,index));
}
function validDate(key) {
  return typeof key === "string" && datePattern.test(key) && dayKey(localDate(key)) === key;
}
function weekLabel(start) {
  return shortDate.format(localDate(start)) + " – " + shortDate.format(localDate(offset(start,6))) + ", " + localDate(offset(start,6)).getFullYear();
}
function emptyTemplate() {
  return jobs.map(() => days.map(() => null));
}
function freshState() {
  return {version:1, rates:jobs.map(job=>job.rate), templates:[], records:{}};
}
function storageStatus(message) {
  const status = document.querySelector("#storage-status");
  status.textContent = message;
  status.hidden = !message;
}
function isObject(value) {
  return value !== null && typeof value === "object" && !Array.isArray(value);
}
function cleanShift(value, worked) {
  if (value === null) return null;
  if (isObject(value) && Object.hasOwn(value,"duration")) {
    if (!Number.isInteger(value.duration) || value.duration < 0 || value.duration > 1439) throw Error("Invalid duration");
    return {duration:value.duration};
  }
  if (!isObject(value) || typeof value.start !== "string" || typeof value.end !== "string" ||
      !timePattern.test(value.start) || !timePattern.test(value.end)) throw Error("Invalid shift");
  const shift = {start:value.start,end:value.end};
  if (worked) {
    if (!Number.isInteger(value.break) || value.break < 0 || value.break > minutes(shift)) throw Error("Invalid break");
    shift.break = value.break;
  }
  return shift;
}
function cleanState(value) {
  if (!isObject(value) || value.version !== 1 || !Array.isArray(value.rates) || value.rates.length !== jobs.length ||
      !Array.isArray(value.templates) || !isObject(value.records)) throw Error("Invalid backup");
  const rates = value.rates.map(rate => {
    if (!Number.isFinite(rate) || rate < 0 || rate > 10000 || Math.abs(rate * 100 - Math.round(rate * 100)) > 1e-6) throw Error("Invalid rate");
    return rate;
  });
  let lastWeek = "";
  const templates = value.templates.map(entry => {
    if (!isObject(entry) || !validDate(entry.from) || weekStart(entry.from) !== entry.from || entry.from <= lastWeek ||
        !Array.isArray(entry.shifts) || entry.shifts.length !== jobs.length) throw Error("Invalid template");
    lastWeek = entry.from;
    return {from:entry.from,shifts:entry.shifts.map(row => {
      if (!Array.isArray(row) || row.length !== days.length) throw Error("Invalid schedule");
      return row.map(shift => cleanShift(shift,false));
    })};
  });
  const records = {};
  for (const [date, row] of Object.entries(value.records)) {
    if (!validDate(date) || !isObject(row)) throw Error("Invalid record");
    records[date] = {};
    for (const [job, entry] of Object.entries(row)) {
      if (!["0","1"].includes(job) || !isObject(entry)) throw Error("Invalid job");
      const record = {};
      if (Object.hasOwn(entry,"scheduled")) record.scheduled = cleanShift(entry.scheduled,false);
      if (Object.hasOwn(entry,"worked")) record.worked = cleanShift(entry.worked,true);
      records[date][job] = record;
    }
  }
  return {version:1,rates,templates,records};
}
function load() {
  try {
    const raw = localStorage.getItem(key);
    if (raw) return cleanState(JSON.parse(raw));
  } catch {
    storageStatus("Saved data could not be opened. You can restore a JSON backup in Profile after setup.");
  }
  return freshState();
}
let state = load();
function save() {
  try {
    localStorage.setItem(key,JSON.stringify(state));
    storageStatus("");
    return true;
  } catch {
    storageStatus("This browser could not save your changes. Export a backup before closing the app.");
    return false;
  }
}
function notify(message) {
  const toast = document.querySelector("#toast");
  toast.textContent = message;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; },2700);
}
function templateFor(date) {
  return state.templates.findLast(entry => entry.from <= date)?.shifts || emptyTemplate();
}
function recordFor(date, job) {
  return state.records[date]?.[job] || {};
}
function scheduledFor(date, job) {
  const entry = recordFor(date,job);
  return Object.hasOwn(entry,"scheduled") ? entry.scheduled : templateFor(date)[job][localDate(date).getDay()];
}
function writeShift(date, job, kind, shift) {
  state.records[date] ??= {};
  state.records[date][job] ??= {};
  state.records[date][job][kind] = shift;
  return save();
}
function clockMinutes(time) {
  const [hours,minutes] = time.split(":").map(Number);
  return hours * 60 + minutes;
}
function minutes(shift) {
  if (!shift) return 0;
  if (Object.hasOwn(shift,"duration")) return shift.duration;
  const span = clockMinutes(shift.end) - clockMinutes(shift.start);
  return (span < 0 ? span + 1440 : span) - (shift.break || 0);
}
function hours(value) {
  const whole = Math.floor(value/60);
  const rest = value%60;
  return whole && rest ? whole+"h "+rest+"m" : rest ? rest+"m" : whole+"h";
}
function payCents(worked,job) {
  return Math.round(worked * Math.round(state.rates[job]*100) / 60);
}
function cash(cents) {
  return money.format(cents/100);
}
function totals(dates, job) {
  const selected = job === undefined ? jobs.keys() : [job];
  const result = {scheduled:0,worked:0,cents:0};
  for (const index of selected) {
    for (const date of dates) {
      const worked = minutes(recordFor(date,index).worked);
      result.scheduled += minutes(scheduledFor(date,index));
      result.worked += worked;
      result.cents += payCents(worked,index);
    }
  }
  return result;
}
function mark(job) {
  return '<span class="mark '+(job===1?"regal":"")+'" style="--job:'+jobs[job].color+'">'+jobs[job].mark+'</span>';
}
function heading(label,title,description="") {
  return '<header class="intro"><span class="eyebrow kicker">'+label+'</span><h1 tabindex="-1">'+title+'</h1>'+
    (description?'<p class="muted">'+description+'</p>':"")+'</header>';
}
function jobRow(date,job) {
  const scheduled = scheduledFor(date,job);
  const entry = recordFor(date,job);
  const logged = Object.hasOwn(entry,"worked");
  const status = logged ? (entry.worked ? hours(minutes(entry.worked))+" worked" : "Didn’t work") : "Unlogged";
  const same = scheduled && entry.worked && minutes(scheduled) === minutes(entry.worked);
  const attributes = ' data-date="'+date+'" data-job="'+job+'"';
  return '<div class="jobrow"><button type="button" class="job-main" data-action="edit"'+attributes+'>'+mark(job)+
    '<span><strong>'+jobs[job].name+'</strong><small>Scheduled · '+(scheduled?hours(minutes(scheduled)):"Off")+'</small><small>'+status+'</small></span></button>'+
    '<button type="button" class="check '+(same?"done":"")+'" data-action="check"'+attributes+
    ' aria-label="'+(same?"Logged as scheduled":"Worked as scheduled")+' · '+jobs[job].name+'"'+(!scheduled||same?" disabled":"")+
    (logged&&!same?' title="Replace the current work entry with the scheduled shift"':"")+'>✓</button></div>';
}
function summary(dates) {
  const row = (label,total) => '<div class="stat-row"><strong>'+label+'</strong><span>'+hours(total.scheduled)+'</span><span>'+hours(total.worked)+'</span><span>'+cash(total.cents)+'</span></div>';
  const labels = '<div class="stat-row stat-labels"><span>Job</span><span>Scheduled</span><span>Worked</span><span>Cash</span></div>';
  return '<details class="card summary" id="summary"><summary><h2>Week totals</h2>'+labels+
    jobs.map((job,i)=>row(job.name,totals(dates,i))).join("")+row("Combined",totals(dates))+'</summary><div class="breakdown">'+labels+
    dates.map(date=>'<h3>'+fullDate.format(localDate(date))+'</h3>'+jobs.map((job,i)=>row(job.name,totals([date],i))).join("")).join("")+
    '</div></details>';
}
function metrics(total) {
  return '<div class="metrics"><div class="card hero"><span class="eyebrow">Hours worked</span><strong>'+hours(total.worked)+'</strong><small>'+hours(total.scheduled)+' scheduled</small></div>'+
    '<div class="card metric"><span class="eyebrow">Cash earned</span><strong>'+cash(total.cents)+'</strong><small>Both jobs combined</small></div></div>';
}
function home() {
  const dates = dateRange(weekStart(today),7);
  const total = totals(dates);
  return heading(fullDate.format(localDate(today)),"Hi there!","Here’s where your week stands.")+
    '<div class="stack"><div class="card hero"><span class="eyebrow">Hours this week</span><strong>'+hours(total.worked)+'</strong><small>'+hours(total.scheduled)+' scheduled · '+weekLabel(dates[0])+'</small></div>'+
    '<div class="card metric"><span class="eyebrow">Cash this week</span><strong>'+cash(total.cents)+'</strong></div></div>'+
    '<div class="section-head"><h2>Today’s jobs</h2><button type="button" class="pill" data-action="today">View week</button></div>'+
    '<p class="muted" style="margin-bottom:9px">Enter hours for both jobs in one place.</p>'+
    '<div class="actions" style="margin-bottom:10px">'+editHoursButton(today)+'</div>'+
    '<div class="stack home-jobs">'+jobs.map((_,i)=>'<div class="card">'+jobRow(today,i)+'</div>').join("")+'</div>'+
    '<div class="section-head"><h2>At a glance</h2></div>'+summary(dates);
}
function periodControls(label) {
  return '<div class="period"><button type="button" class="icon-button" data-action="previous" aria-label="Previous '+(screen==="Overview"&&overview==="Month"?"month":"week")+'">‹</button>'+
    '<strong>'+label+'</strong><button type="button" class="pill" data-action="today">Today</button>'+
    '<button type="button" class="icon-button" data-action="next" aria-label="Next '+(screen==="Overview"&&overview==="Month"?"month":"week")+'">›</button></div>';
}
function weekScreen() {
  const dates = dateRange(week,7);
  return heading("Your shifts","Week","Tap Edit hours to enter both jobs for a day.")+periodControls(weekLabel(week))+
    '<div class="strip" aria-label="Jump to a day">'+dates.map((date,i)=>'<button type="button" data-action="jump" data-date="'+date+'" class="'+(date===today?"current":"")+
    '" aria-label="'+fullDate.format(localDate(date))+'"'+(date===today?' aria-current="date"':"")+'><small>'+days[i].slice(0,3)+'</small>'+localDate(date).getDate()+'</button>').join("")+'</div>'+
    '<div class="stack">'+summary(dates)+dates.map(date=>'<section tabindex="-1" id="day-'+date+'" class="card day-card '+(date===today?"today":"")+'"><div class="day-head"><h2>'+fullDate.format(localDate(date))+'</h2>'+
    editHoursButton(date)+'</div>'+jobs.map((_,i)=>jobRow(date,i)).join("")+'</section>').join("")+'</div>';
}
function monthRange(anchor) {
  const start = localDate(anchor);
  start.setDate(1);
  const end = new Date(start);
  end.setMonth(end.getMonth()+1,0);
  return dateRange(dayKey(start),end.getDate());
}
let monthAnchor = today;
function chart(dates) {
  const monthly = overview==="Month";
  const width = monthly ? 650 : 370;
  const left = 31, baseline = 148, plotHeight = 122;
  const slot = (width-left-8)/dates.length;
  const barWidth = Math.min(28,slot*.66);
  const series = dates.map(date=>jobs.map((_,i)=>minutes(recordFor(date,i).worked)));
  const top = Math.max(120,Math.ceil(Math.max(...series.map(values=>values[0]+values[1]))/120)*120);
  const guides = [0,top/2,top].map(value=>{
    const y = baseline-value/top*plotHeight;
    return '<path d="M'+left+' '+y+'H'+(width-8)+'" stroke="#e5e9df"/><text x="0" y="'+(y+4)+'">'+hours(value)+'</text>';
  }).join("");
  const bars = series.map((values,index)=>{
    const center = left+slot*(index+.5);
    let y = baseline;
    const rects = values.map((value,job)=>{
      const height = value/top*plotHeight;
      y -= height;
      return '<rect x="'+(center-barWidth/2)+'" y="'+y+'" width="'+barWidth+'" height="'+height+'" fill="'+jobs[job].color+'"/>';
    }).join("");
    const tick = monthly ? String(index+1) : days[index].slice(0,3);
    return '<g><title>'+fullDate.format(localDate(dates[index]))+' · '+jobs.map((job,i)=>job.name+' '+hours(values[i])).join(', ')+'</title>'+rects+
      '<text text-anchor="middle" x="'+center+'" y="168"'+(dates[index]===today?' font-weight="800"':"")+'>'+tick+'</text></g>';
  }).join("");
  const description = dates.map((date,index)=>shortDate.format(localDate(date))+" "+jobs.map((job,i)=>job.name+" "+hours(series[index][i])).join(", ")).join(". ");
  return '<section class="card chart"><div class="spread"><h2>Hours by day</h2><span class="tag">WORKED</span></div>'+
    '<div class="chart-scroll '+(monthly?"month":"")+'"'+(monthly?' tabindex="0" aria-label="Scrollable chart"':"")+'><svg viewBox="0 0 '+width+' 178" role="img" aria-labelledby="chart-title chart-desc" fill="#52675d" font-size="11">'+
    '<title id="chart-title">Daily worked hours by job</title><desc id="chart-desc">'+description+'</desc>'+guides+bars+'</svg></div>'+
    '<div class="legend">'+jobs.map(job=>'<span><i style="background:'+job.color+'"></i>'+job.name+'</span>').join("")+'</div></section>';
}
function overviewScreen() {
  const monthly = overview==="Month";
  const dates = monthly ? monthRange(monthAnchor) : dateRange(week,7);
  return heading("Your time and pay","Overview")+
    '<div class="section-head"><div class="segmented" aria-label="Overview range">'+["Week","Month"].map(range=>'<button type="button" data-action="range" data-range="'+range+'" aria-pressed="'+(range===overview)+'">'+range+'</button>').join("")+'</div></div>'+
    periodControls(monthly?monthDate.format(localDate(monthAnchor)):weekLabel(week))+
    '<div class="stack">'+metrics(totals(dates))+chart(dates)+(monthly?"":summary(dates))+'</div>';
}
function profile() {
  return heading("Make it yours","Profile")+
    '<div class="stack"><form id="rates" class="card"><h2>Hourly rates</h2><p class="muted">Both jobs pay in cash.</p><div class="form-grid actions">'+
    jobs.map((job,i)=>'<label class="field">'+job.name+' ($/hr)<input type="number" name="rate'+i+'" required min="0" max="10000" step="0.01" inputmode="decimal" value="'+state.rates[i]+'"></label>').join("")+
    '</div><div class="actions"><button class="primary">Save rates</button></div></form>'+
    '<section class="card"><h2>Weekly schedule</h2><p class="muted">Set the regular shifts that fill each week.</p><div class="actions"><button type="button" class="secondary" data-action="template">Edit weekly template</button></div></section>'+
    '<section class="card"><h2>Your data</h2><p class="muted">Export a backup or bring one over from another phone.</p><div class="actions"><button type="button" class="secondary" data-action="export">Export JSON</button><button type="button" class="secondary" data-action="import">Import JSON</button><button type="button" class="danger" data-action="reset">Reset tracker</button></div></section></div>';
}
function hourField(label,name,shift) {
  const value = shift == null ? "" : String(Number((minutes(shift)/60).toFixed(2)));
  return '<label class="field">'+label+'<input type="number" name="'+name+
    '" inputmode="decimal" min="0" max="23.98" step="0.01" placeholder="0" value="'+value+'"></label>';
}
function readHours(data,name) {
  const value = data.get(name);
  return value === "" ? null : Math.round(Number(value)*60);
}
function editHoursButton(date) {
  return '<button type="button" class="pill" data-action="edit" data-date="'+date+'" aria-label="Edit hours for '+
    fullDate.format(localDate(date))+'">Edit hours</button>';
}
function templateScreen(setup) {
  const template = templateFor(today);
  return heading(setup?"First-time setup":"Regular hours",setup?"Set your schedule":"Weekly template",
    "Enter the usual hours for each job. Leave days off blank. For half an hour, enter 0.5.")+
    '<form class="stack" id="template-form">'+days.map((day,j)=>'<section class="card"><h2>'+day+'</h2>'+
    '<div class="form-grid actions">'+jobs.map((job,i)=>hourField(job.name+' hours',i+"-"+j,template[i][j])).join("")+'</div></section>').join("")+
    '<div class="actions template-actions">'+(setup?'<button type="button" class="secondary" data-action="import">Import backup</button>':'<button type="button" class="secondary" data-action="cancel-template">Cancel</button>')+
    '<button class="primary">'+(setup?"Save and start":"Save template")+'</button></div></form>';
}
function render(focus=false) {
  today = dayKey(new Date());
  const setup = !state.templates.length;
  const wasOpen = !!view.querySelector("#summary[open]");
  document.body.classList.toggle("setup",setup);
  nav.hidden = setup;
  tabList.innerHTML = Object.entries(tabs).map(([tab,icon])=>'<button type="button" data-action="tab" data-tab="'+tab+'"'+(tab===screen?' aria-current="page"':"")+
    '><svg viewBox="0 0 24 24" aria-hidden="true">'+icon+'</svg>'+tab+'</button>').join("");
  view.innerHTML = setup || editingTemplate ? templateScreen(setup) :
    {Home:home,Week:weekScreen,Overview:overviewScreen,Profile:profile}[screen]();
  const details = view.querySelector("#summary");
  if (wasOpen && details && !focus) details.open = true;
  if (focus) {
    window.scrollTo(0,0);
    view.querySelector("h1").focus({preventScroll:true});
  }
}
function openEditor(date,trigger) {
  editing = {date,trigger,kind:"worked"};
  renderEditor();
  editor.showModal();
}
function renderEditor() {
  const {date,kind} = editing;
  const worked = kind === "worked";
  editor.innerHTML = '<div class="sheet-handle" aria-hidden="true"></div><div class="spread"><div><p class="eyebrow">'+
    fullDate.format(localDate(date))+'</p><h2 id="editor-title">Edit daily hours</h2></div>'+
    '<button type="button" class="icon-button" data-action="close" aria-label="Close hours editor" autofocus>×</button></div>'+
    '<div class="segmented" aria-label="Hours to edit">'+["worked","scheduled"].map(mode=>'<button type="button" data-action="shift-kind" data-kind="'+mode+
    '" aria-pressed="'+(kind===mode)+'">'+(mode==="worked"?"Worked":"Scheduled")+'</button>').join("")+'</div>'+
    '<p class="muted">'+(worked?"Enter hours after breaks. Use 0 for a day off, or leave blank to keep it unlogged.":"Enter planned hours for this date. Leave a job blank if it’s off.")+
    ' For half an hour, enter 0.5.</p><form id="shift-form"><div class="form-grid actions">'+jobs.map((job,i)=>{
      const entry = recordFor(date,i);
      const shift = worked ? (entry.worked ?? (Object.hasOwn(entry,"worked")?{duration:0}:null)) : scheduledFor(date,i);
      return hourField(job.name+' hours',"job-"+i,shift);
    }).join("")+'</div><p class="live" id="shift-live" aria-live="polite"></p>'+
    '<div class="actions"><button class="primary">Save '+(worked?"worked":"scheduled")+' hours</button></div></form>';
  updateShiftPreview();
}
function updateShiftPreview() {
  const form = editor.querySelector("form");
  const live = editor.querySelector("#shift-live");
  if (!form.checkValidity()) {
    live.textContent = "Check the hours entered";
    return;
  }
  const data = new FormData(form);
  const values = jobs.map((_,job)=>readHours(data,"job-"+job) || 0);
  const total = hours(values[0]+values[1]);
  live.textContent = editing.kind === "worked" ?
    total+" · "+cash(payCents(values[0],0)+payCents(values[1],1)) : total+" scheduled";
}
function saveDailyHours(data) {
  const {date,kind} = editing;
  const row = state.records[date] ??= {};
  jobs.forEach((_,job)=>{
    const duration = readHours(data,"job-"+job);
    const entry = row[job] ??= {};
    if (kind === "worked") {
      if (duration === null) delete entry.worked;
      else if (duration === 0) entry.worked = null;
      else if (!entry.worked || minutes(entry.worked) !== duration) entry.worked = {duration};
    } else if ((duration || 0) !== minutes(scheduledFor(date,job))) {
      entry.scheduled = duration ? {duration} : null;
    }
  });
  const saved = save();
  editor.close();
  render();
  if (saved) notify("Daily hours saved");
}
editor.addEventListener("close", () => {
  if (!editing) return;
  const {date,trigger} = editing;
  editing = null;
  const target = trigger.isConnected ? trigger : view.querySelector('[data-action="edit"][data-date="'+date+'"]');
  target?.focus({preventScroll:true});
});
editor.addEventListener("input", updateShiftPreview);
document.addEventListener("submit", event => {
  const form = event.target;
  event.preventDefault();
  const data = new FormData(form);
  if (form.id === "shift-form") {
    saveDailyHours(data);
  } else if (form.id === "rates") {
    state.rates = jobs.map((_,i)=>Number(data.get("rate"+i)));
    if (save()) notify("Rates saved");
  } else if (form.id === "template-form") {
    const from = weekStart(dayKey(new Date()));
    const shifts = jobs.map((_,i)=>days.map((_,j)=>{
      const duration = readHours(data,i+"-"+j);
      return duration ? {duration} : null;
    }));
    state.templates = state.templates.filter(entry=>entry.from !== from);
    state.templates.push({from,shifts});
    state.templates.sort((a,b)=>a.from.localeCompare(b.from));
    editingTemplate = false;
    const saved = save();
    render(true);
    if (saved) notify("Weekly template saved");
  }
});
function exportBackup() {
  const url = URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:"application/json"}));
  const link = document.createElement("a");
  link.href = url;
  link.download = "my-hours-"+today+".json";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
}
const importFile = document.querySelector("#import-file");
importFile.addEventListener("change", async () => {
  const file = importFile.files[0];
  importFile.value = "";
  if (!file) return;
  let replacement;
  try {
    replacement = cleanState(JSON.parse(await file.text()));
  } catch {
    notify("This file isn’t a valid My Hours backup.");
    return;
  }
  if (state.templates.length && !window.confirm("Replace this phone’s shifts, schedule and rates with this backup?")) return;
  state = replacement;
  editingTemplate = false;
  const saved = save();
  render(true);
  if (saved) notify("Backup imported");
});
function changePeriod(direction) {
  if (screen === "Overview" && overview === "Month") {
    const date = localDate(monthAnchor);
    date.setDate(1);
    date.setMonth(date.getMonth()+direction);
    monthAnchor = dayKey(date);
  } else {
    week = offset(week,direction*7);
  }
}
document.addEventListener("click", event => {
  const button = event.target.closest("button[data-action]");
  if (!button) return;
  const {action,date,tab,kind,range} = button.dataset;
  const job = Number(button.dataset.job);
  switch (action) {
    case "tab":
      screen = tab;
      editingTemplate = false;
      render(true);
      break;
    case "today":
      today = dayKey(new Date());
      week = weekStart(today);
      monthAnchor = today;
      if (screen === "Home") screen = "Week";
      render();
      if (screen === "Week") jumpTo(today);
      else view.querySelector('[data-action="today"]').focus();
      break;
    case "previous":
    case "next":
      changePeriod(action==="next"?1:-1);
      render();
      view.querySelector('[data-action="'+action+'"]').focus();
      break;
    case "range":
      if (range !== overview) {
        if (range === "Month") monthAnchor = week===weekStart(today) ? today : offset(week,3);
        else week = weekStart(monthAnchor);
        overview = range;
        render();
        view.querySelector('[data-range="'+range+'"]').focus();
      }
      break;
    case "jump": jumpTo(date); break;
    case "edit": openEditor(date,button); break;
    case "check": {
      const shift = scheduledFor(date,job);
      if (!shift) break;
      const saved = writeShift(date,job,"worked",{duration:minutes(shift)});
      render();
      view.querySelector('[data-action="edit"][data-date="'+date+'"][data-job="'+job+'"]')?.focus({preventScroll:true});
      if (saved) notify("Logged "+hours(minutes(shift))+" at "+jobs[job].name);
      break;
    }
    case "close": editor.close(); break;
    case "shift-kind":
      if (kind !== editing.kind) {
        editing.kind = kind;
        renderEditor();
        editor.querySelector('[data-kind="'+kind+'"]').focus();
      }
      break;
    case "template":
    case "cancel-template":
      editingTemplate = action === "template";
      render(true);
      break;
    case "export": exportBackup(); break;
    case "import": importFile.click(); break;
    case "reset":
      if (window.confirm("Delete all saved shifts, schedule and rates from this phone?")) {
        state = freshState();
        editingTemplate = false;
        screen = "Home";
        week = weekStart(today);
        overview = "Week";
        monthAnchor = today;
        const saved = save();
        render(true);
        if (saved) notify("Tracker reset");
      }
      break;
  }
});
function jumpTo(date) {
  const target = document.querySelector("#day-"+date);
  target?.focus({preventScroll:true});
  target?.scrollIntoView({block:"start"});
}
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && today !== dayKey(new Date()) && !editor.open &&
      !view.querySelector("#template-form") && !view.contains(document.activeElement)) {
    if (week === weekStart(today)) week = weekStart(dayKey(new Date()));
    render();
  }
});

const standalone = matchMedia("(display-mode: standalone)");
const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
  (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const hint = document.querySelector("#install-hint");
const installButton = document.querySelector("#install-button");
let installPrompt;
let dismissed = false;
let visits = 1;
if (!standalone.matches && !navigator.standalone) {
  try {
    visits = (Number(localStorage.getItem("my-hours.install-visits")) || 0) + 1;
    localStorage.setItem("my-hours.install-visits",String(visits));
  } catch { /* The hint can still be dismissed for this visit. */ }
}
function updateInstallHint() {
  hint.hidden = dismissed || visits > 2 || standalone.matches || navigator.standalone || (!ios && !installPrompt);
  installButton.hidden = !installPrompt;
  document.querySelector("#install-copy").textContent = ios ? "Tap Share, then Add to Home Screen" : "Open My Hours like any other app.";
}
window.addEventListener("beforeinstallprompt", event => {
  event.preventDefault();
  installPrompt = event;
  updateInstallHint();
});
installButton.addEventListener("click", async () => {
  if (!installPrompt) return;
  const prompt = installPrompt;
  installPrompt = null;
  try { await prompt.prompt(); } finally { updateInstallHint(); }
});
document.querySelector("#dismiss-hint").addEventListener("click", () => {
  dismissed = true;
  updateInstallHint();
});
window.addEventListener("appinstalled", () => {
  dismissed = true;
  installPrompt = null;
  updateInstallHint();
});
standalone.addEventListener("change",updateInstallHint);
updateInstallHint();
render();
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js").catch(error=>console.warn("Offline setup failed",error));
}
</script>
</body>
</html>
